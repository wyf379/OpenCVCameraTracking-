name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore OpenCVCameraTracking.slnx

    - name: Build
      run: dotnet build OpenCVCameraTracking.slnx --configuration Release --no-restore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCVCameraTracking
        path: |
          src/OpenCVCameraTracking/bin/Release/
          src/OpenCVCameraTracking.Core/bin/Release/
        retention-days: 7
