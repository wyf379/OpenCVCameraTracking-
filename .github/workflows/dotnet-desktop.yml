name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: |
        dotnet restore src/OpenCVCameraTracking.Core/OpenCVCameraTracking.Core.csproj
        dotnet restore src/OpenCVCameraTracking/OpenCVCameraTracking.csproj

    - name: Build Core library
      run: |
        msbuild src/OpenCVCameraTracking.Core/OpenCVCameraTracking.Core.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:RestorePackages=false `
          /verbosity:minimal

    - name: Build main application
      run: |
        msbuild src/OpenCVCameraTracking/OpenCVCameraTracking.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:RestorePackages=false `
          /verbosity:minimal

    - name: Prepare release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Get-ChildItem -Path src/OpenCVCameraTracking/bin/x64/Release -Recurse -File | Copy-Item -Destination publish
        Get-ChildItem -Path src/OpenCVCameraTracking.Core/bin/x64/Release -Recurse -File | Copy-Item -Destination publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: OpenCVCameraTracking-Release
        path: publish/
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: OpenCVCameraTracking-Release
        path: release-assets

    - name: Create zip package
      shell: pwsh
      run: |
        Compress-Archive -Path release-assets/* -DestinationPath OpenCVCameraTracking-Release.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: OpenCVCameraTracking-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
